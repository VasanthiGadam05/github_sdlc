name: docsync CI (FR-8)

# Implements FR-8: CI integration that fails the build when the docsync scan
# finds symbols with "Not Found in docs" drift, and warns-only (never fails)
# on orphaned/stale docs entries.

on:
  pull_request:
    paths:
      - "src/docsync/**"
      - "docs/**"
      - "tests/**"
  push:
    branches: [main]
    paths:
      - "src/docsync/**"
      - "docs/**"

permissions:
  contents: read

jobs:
  docsync-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # NFR-6: docsync is standard-library-only at runtime. This step is a
      # guard, not an install step — there is no requirements.txt to install.
      - name: Verify no runtime dependency was introduced (NFR-6)
        run: |
          if [ -f requirements.txt ] && grep -vqE '^\s*(#|pytest|coverage|$)' requirements.txt; then
            echo "::error::requirements.txt appears to declare a runtime dependency. docsync is stdlib-only per NFR-6."
            exit 1
          fi

      - name: Run test suite
        run: |
          python -m pip install --upgrade pip pytest pytest-cov
          pytest tests/ -v --tb=short

      - name: Run docsync scan (Markdown report)
        id: scan
        run: |
          python -m docsync --src src --docs docs --format md > docsync-report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Upload docsync report
        uses: actions/upload-artifact@v4
        with:
          name: docsync-report
          path: docsync-report.md

      - name: Fail build on "Not Found in docs" symbols (FR-3, FR-8)
        run: |
          if grep -q "Not Found in docs" docsync-report.md; then
            echo "::error::docsync found undocumented public symbols. See the docsync-report artifact."
            grep -B1 "Not Found in docs" docsync-report.md || true
            exit 1
          fi
          echo "No missing-documentation drift found."

      - name: Warn (do not fail) on orphaned/stale docs (FR-4, FR-8)
        run: |
          if grep -qi "orphaned" docsync-report.md; then
            echo "::warning::docsync found orphaned/stale documentation entries. See the docsync-report artifact."
            grep -Bi1 "orphaned" docsync-report.md || true
          else
            echo "No orphaned documentation found."
          fi
